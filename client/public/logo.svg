<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
    <!-- 添加一个微微的粉色腮红渐变 -->
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A8A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF8A8A" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- 图标区 -->
  <g transform="translate(60, 50)">
    <!-- 背景圆角方形 -->
    <rect x="0" y="0" width="160" height="160" rx="40" fill="#F0F9FF" />
    <!-- 完美的 iOS 风格气泡 -->
    <g filter="url(#shadow)">
      <path d="M 40 35
L 120 35
C 133 35 140 42 140 55
L 140 90
C 140 103 133 110 120 110
L 65 110
L 42 128
C 41 129 39 128 40 126
L 45 110
L 40 110
C 27 110 20 103 20 90
L 20 55
C 20 42 27 35 40 35 Z"
fill="url(#mainGrad)" />
    </g>
    <!-- ====== 可爱的眼睛与表情 ====== -->
    <!-- 腮红 (位于眼睛下方) -->
    <circle cx="55" cy="82" r="10" fill="url(#blushGrad)" />
    <circle cx="105" cy="82" r="10" fill="url(#blushGrad)" />
    <!-- 左眼 (白色大圆底 + 蓝色小瞳孔) -->
    <circle cx="62" cy="70" r="10" fill="#FFFFFF" />
    <circle cx="62" cy="70" r="5" fill="#1E3A8A" />
    <circle cx="60" cy="68" r="2" fill="#FFFFFF" /> <!-- 高光 -->
    <!-- 右眼 -->
    <circle cx="98" cy="70" r="10" fill="#FFFFFF" />
    <circle cx="98" cy="70" r="5" fill="#1E3A8A" />
    <circle cx="96" cy="68" r="2" fill="#FFFFFF" /> <!-- 高光 -->
    <!-- 微笑的小嘴巴 -->
    <path d="M 75 85 Q 80 92 85 85" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>
  <!-- 文字区 -->
  <g transform="translate(260, 140)">
    <text x="0" y="0" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="900" fill="#0F172A" letter-spacing="4">短句</text>
    <text x="4" y="45" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#0EA5E9" letter-spacing="12">ENGLISH</text>
  </g>
</svg>
